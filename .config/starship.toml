add_newline = true
command_timeout = 200
format = "$shell$directory$fill$git_branch$git_status$all$character"


[character]
error_symbol = "[](bold red)"
success_symbol = "[](#00ff00)"

[directory]
format = '[$path](bold #00b4ff)[$read_only]($read_only_style) '
truncation_length = 99
truncation_symbol = "…/"
truncate_to_repo = false

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"

[git_status]
format     = '[$all_status]($style)'
style      = "$style"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "[󱀶 ${count} ](#b6aa03)"
modified   = " ${count} "
stashed    = " ${count} "
staged     = "[ ${count} ](#00c295)"
renamed    = " ${count} "
deleted    = "[ ${count} ](red)"

[os]
disabled = true

[os.symbols]
Arch = " "

[shell]
disabled = false
fish_indicator = '  '
bash_indicator = ' '
format = "[$indicator]($style)"

[fill]
symbol = ' '
